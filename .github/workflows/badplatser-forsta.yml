# TILLFÄLLIG (#279): bygger den första badplatsfilen på grenen, eftersom
# molnsessionen inte når Overpass och minin bygger den först nästa måndag.
# Tas bort i samma PR innan merge - filen hålls sedan färsk av nattkedjan.
name: Badplatsfilen (första bygget)
on:
  push:
    branches: [claude/badplatser-zoom9]
    paths: ['.github/workflows/badplatser-forsta.yml']
permissions:
  contents: write
jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run badplatser
        working-directory: apps/scraper
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/badplatser.json
          git commit -m "data: första badplatsfilen ur OSM (#279)"
          git push
