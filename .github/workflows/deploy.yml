name: Deploy till Firebase

# Deployar vid KOD-push till main. Kan även triggas manuellt under
# Actions-fliken (Run workflow).
#
# Morgon-cronen (06:00 UTC) ÅTERAKTIVERAD 26/8 — main är i kapp (allt
# frontend-arbete går numera via main, inga manuella deployer från
# arbetsmaskinen att skriva över). Den bakar om de statiska stadssidorna
# (SEO) varje morgon; eventdatan i /api/events/[layer] är färsk ändå
# (läser live ur Firestore, 1 h CDN-cache).
#
# Kräver två repo-secrets (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT — hela JSON-nyckeln från Firebase Console →
#       Projektinställningar → Tjänstkonton → Generera ny privat nyckel
#   WEB_ENV — hela innehållet i apps/web/.env (NEXT_PUBLIC_*-raderna)
on:
  schedule:
    - cron: '0 6 * * *' # UTC → 08:00 svensk sommartid / 07:00 vintertid
  push:
    branches: [main]
    # Auto-pushar ska inte bygga om frontenden: Mac minins nattliga
    # data-commit (whitelistade paths i run-daily.sh) och rena workflow-/
    # docs-ändringar hoppar över deployen. En push som rör webbkod
    # (apps/web/src m.m.) deployar som vanligt.
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - 'apps/web/public/events-*.json'
      - 'apps/scraped_events.json'
      - 'apps/scraper/**'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Bygg + deploya (Firebase frameworks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Klientkonfigen (NEXT_PUBLIC_*) ligger inte i git — hela .env-filen
      # förvaras som EN secret.
      - name: Skriv apps/web/.env
        run: printf '%s\n' "$WEB_ENV" > apps/web/.env
        env:
          WEB_ENV: ${{ secrets.WEB_ENV }}

      # Färskt eventdata: hämtas via sajtens egen CDN-route (exakt samma form
      # som de statiska filerna). Misslyckas något lager behålls repo-versionen
      # — deployen får aldrig stupa på datahämtningen.
      - name: Uppdatera eventdata från produktion
        run: |
          for layer in destinations cards descriptions; do
            f="apps/web/public/events-$layer.json"
            if curl -fsS --compressed --max-time 180 "https://vadkul.se/api/events/$layer" -o "$f.new" \
               && [ "$(wc -c < "$f.new")" -gt 500000 ] \
               && node -e "JSON.parse(require('fs').readFileSync('$f.new','utf8'))"; then
              mv "$f.new" "$f"
              echo "$layer: uppdaterad till $(wc -c < "$f") byte"
            else
              rm -f "$f.new"
              echo "$layer: hämtningen misslyckades — behåller repo-versionen"
            fi
          done

      # Dagens statiska slice (public/events-today.json) — ren CDN-fil för
      # kartans snabbstart, bakad ur nyss uppdaterade destinations. Körs även
      # som prebuild vid lokala byggen; här explicit eftersom frameworks-
      # deployen inte garanterat kör npm-lifecycle-hooks.
      - name: Baka dagens statiska event-slice
        run: node scripts/build-events-today.mjs
        working-directory: apps/web

      - name: Installera beroenden
        run: npm ci

      # Frameworks-deployen bygger Next-appen själv och deployar hosting +
      # SSR-funktionen i ett svep. --only hosting rör INTE firestore-regler
      # eller övriga functions.
      - name: Deploya
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          # Samma version som den lokalt verifierade deployen — v14 genererar
          # ett funktionspaket med äldre sharp än repo-lockfilen (npm ci-krasch
          # i Cloud Build).
          npx firebase-tools@15.22.4 deploy --only hosting --project vadkul-f2cb2 --force
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      # Direkt efterkontroll — misslyckas den blir körningen röd och GitHub
      # mejlar. Samma kontroller som SEO-kanarien, fast direkt efter deploy.
      - name: Efterkontroll
        run: |
          sleep 20
          fail=0
          h1=$(curl -fsS --max-time 30 https://vadkul.se/evenemang/malmo | grep -c '<h1' || true)
          [ "${h1:-0}" -ge 1 ] || { echo '::error::Stadssidan saknar <h1> efter deploy — SSR trasig?'; fail=1; }
          curl -fsS -o /dev/null --max-time 30 https://vadkul.se/sitemap.xml || { echo '::error::sitemap.xml svarar inte'; fail=1; }
          curl -fsS -o /dev/null --compressed --max-time 60 https://vadkul.se/api/events/destinations || { echo '::error::/api/events/destinations svarar inte'; fail=1; }
          exit $fail
