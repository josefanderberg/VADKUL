name: Typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-scraper:
    name: Scraper (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/scraper/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Scraperns enhetstester. Inga secrets behövs: utan service-account.json
      # varnar config bara (db=null), vitest tvingar SQLite till :memory: och
      # allt IO mockas.
      - run: npm test

  typecheck-kontrakt-functions:
    name: Kontrakt + Functions (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # Root-lockfilen täcker både packages/kontrakt och apps/functions
      # (workspaces) — functions egen lockfil är Mac-deployens standalone-spår.
      - run: npm ci
      # Delade kontraktspaketet: typer + GULDTESTET (eventShareSlug).
      - run: npx tsc --noEmit
        working-directory: packages/kontrakt
      - run: npm test
        working-directory: packages/kontrakt
      # Functions: build = tsc --noEmit + esbuild-bundling (kontraktet bakas
      # in i lib/ — workspace-deps löser inte i Cloud Build, se planen §5).
      - run: npm run build
        working-directory: apps/functions
      - run: npm test
        working-directory: apps/functions

  # RÖKTEST (efter prodstoppet 25/9: maplibre 6-workern skeppades aldrig av
  # webpack — tsc/tester/bygget var gröna men kartan död i prod). Bygger
  # sajten, startar den och låter riktig Chromium ladda kartan: worker-filerna
  # ska svara 200 med JS-MIME, inga kartfel i konsolen, canvas i DOM.
  # Fångar hela klassen "grönt bygge, död sida" FÖRE merge.
  roktest-karta:
    name: Röktest karta (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        working-directory: apps/web
      - run: node scripts/roktest-karta.mjs
        working-directory: apps/web
        env:
          CHROME_PATH: /usr/bin/google-chrome

  typecheck-web:
    name: Web (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # Installera hela monorepon från root-lockfilen (web har ingen egen lockfil).
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: apps/web
      # Webbens enhetstester (vitest, rena funktioner — inget nät/Firebase).
      - run: npm test
        working-directory: apps/web
